<!DOCTYPE html>
<!--Need section for title box, input box and output box-->
<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        
        <title>Wordio</title>
        
        <script src="https://kit.fontawesome.com/bc24f2ee3e.js" crossorigin="anonymous"></script>
        <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
        <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
        <link rel="manifest" href="favicon/site.webmanifest">

    </head> 


    <body>

        <div class="titlehead">
            <div id="title">
                <h1>Wordio</h1>
            </div>
            
            <div class="tlinks">
                <div id="github">
                    <button id="githublink" title="GitHub Repository" onclick="window.open('https://github.com/KayleighSoane/COMP1004ComputingProject', '_blank')"><i class="fa-brands fa-github"></i></button>
                </div>
                <div id="about">
                    <button type="button" id="aboutbtn" title="Help"><i class="fa-solid fa-question"></i></button>
                    <div id="aboutcontent">
                        <p>Morse code only translates with English. Mic button speech to text. Arrow button swaps languages. Copy button copies output text. Use theme selector to change to colorblind modes. 
                        </p>
                    </div>
                </div>
            </div>

        </div>

        <div class="theme">
            <select id="theme-select" title="Theme">
                <option value="light" selected>Light Mode</option>
                <option value="dark">Dark Mode</option>
            </select>
        </div>

        <br>

        <div class="display">

            <div class="textboxes">
                
                <div id="input">
                    
                    <div class="ipdown">
                        <select class="ttext" title="Input language" id="ip"></select>
                    </div>
                    
                    <br><br>
                    <textarea maxlength="5000" id="userinput" autocomplete="on" placeholder ="Enter text..." label="Text input"></textarea>

                    <button id="ipspeech" title="Speak"><i class="fa-solid fa-microphone"></i></button>
                    <button id="swap" title="Swap" onclick="swapLanguages()"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
                </div>
                
                <div id="output">
                    
                    <div class="opdown">
                        <select class="ttext" title="Output language" id="op"></select> <!-- coded in js.js -->
                    </div>
                    
                    <br><br>
                    <textarea readonly id="textoutput" autocomplete="on" placeholder ="Translation" label="Text output"></textarea>
                    
                    <div class="copyset">
                    <button id="opspeech" title="Speak"><i class="fa-solid fa-microphone"></i></button>
                    <button id="opcopy" title="Copy" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i></button>
                    <div id="copy-message" aria-live="polite">Copied</div>    
                    </div>
                </div>
                
            </div>

        </div>

        <script src="languages.js"></script>
        <script src="translation.js"></script>

    </body>

</html>
