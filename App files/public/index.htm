<!DOCTYPE html>
<!--Need section for title box, input box and output box-->
<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        
        <title>Wordio</title>
        
        <script src="https://kit.fontawesome.com/bc24f2ee3e.js" crossorigin="anonymous"></script>
        <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
        <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
        <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
        <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
        <link rel="manifest" href="favicon/site.webmanifest">

    </head> 


    <body>
        
        <div class="theme">
            <select id="theme-select" title="Colour Theme">
                <option value="light" selected>Light</option>
                <option value="dark">Dark</option>
            </select>

            <select id="lang-select" title="Language">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese</option>
            </select>

        </div>

        <div id="sidenav">
            <a class="closebtn" onclick="closeNav()"><i class="fa-solid fa-x"></i></a>
            <a id="newabout" onclick="showabout()">About</a>
                <p id="newaboutmessage">Morse code is only compatible with English.<br>Use theme selector to change to colorblind modes.</p>
            <a class="historybtn">History</a>
        </div>        
        <span id="navopen" onclick="openNav()"><i class="fa-solid fa-bars"></i> About + History</span>
        
        <div class="titlehead">
            <div id="title">
                <h1>Wordio</h1>
            </div>
            
            <div class="tlinks">
                <div id="github">
                    <button id="githublink" title="GitHub Repository" onclick="window.open('https://github.com/KayleighSoane/COMP1004ComputingProject', '_blank')"><i class="fa-brands fa-github"></i></button>
                </div>
            </div>
            
        </div>
        
        
        <div class="display">
            
            <div id="dropdowns">
                <div class="ipdown">
                    <select class="ttext" title="Input language" id="ip"></select>
                </div>
                
                <button id="swap" title="Swap" onclick="swapLanguages()"><i class="fa-solid fa-arrow-right-arrow-left"></i></button>
                
                <div class="opdown">
                    <select class="ttext" title="Output language" id="op"></select> <!-- coded in translation.js -->
                </div>
            </div>
            
            <div class="textboxes">
                <div id="input">
                    <textarea maxlength="5000" id="userinput" autocomplete="on" placeholder ="Enter text..." title="Text input"></textarea>
                    
                    <button id="ipspeech" title="Speak" onclick="inputSpeech()"><i class="fa-solid fa-microphone"></i></button>
                </div>
                
                <div id="output">
                    <textarea readonly id="textoutput" autocomplete="on" placeholder ="Translation" title="Text output"></textarea>
                    
                    <div class="copyset">
                        <button id="opspeech" title="Speak" onclick="outputSpeech()"><i class="fa-solid fa-microphone"></i></button>
                        <button id="opcopy" title="Copy" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i></button>
                        <div id="copy-message" aria-live="polite">Copied to Clipboard</div>    
                    </div>
                </div>
                
            </div>

        </div>

        <script src="languages.js"></script>
        <script src="translation.js"></script>

    </body>

</html>
